services:
  mongo:
    image: mongo:7.0
    container_name: continuum-mongo
    restart: unless-stopped

    ports:
      - "45171:45171"

    volumes:
      - mongo_data:/data/db

    environment:
      MONGO_INITDB_DATABASE: continuum
      MONGO_INITDB_ROOT_USERNAME: continuum_admin
      MONGO_INITDB_ROOT_PASSWORD: continuum_dev_pw

    # Single-node replica set (rs0) so continuum-deploy can use transactions.
    # A replica set with sign-in needs a key file; MongoDB requires it to be owned
    # by the mongodb user and readable only by it, so it is copied in with those
    # permissions before the server starts. The key file itself is created by the
    # owner at docker/mongo/mongo-keyfile (gitignored) and never committed.
    secrets:
      - mongo_keyfile
    command:
      - bash
      - -c
      - >-
        install -m 400 -o 999 -g 999 /run/secrets/mongo_keyfile /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --bind_ip_all --port 45171
        --replSet rs0 --keyFile /tmp/mongo-keyfile

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "mongodb://continuum_admin:continuum_dev_pw@localhost:45171/admin",
          "--quiet",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  continuum-api:
    build:
      context: ../continuum-api
    container_name: continuum-api
    restart: unless-stopped

    ports:
      - "45170:45170"

    environment:
      PORT: 45170
      NODE_ENV: development
      LOG_LEVEL: debug
      DB_NAME: continuum
      JWT_SECRET: dev-secret
      CLIENT_ORIGIN: http://localhost:45173
      MONGO_URI: mongodb://continuum_admin:continuum_dev_pw@continuum-mongo:45171/continuum?authSource=admin
      # Continuum Workspaces: the service's internal API, and where browsers open the editors
      WORKSPACES_URL: http://continuum-workspaces:45177
      WORKSPACES_PUBLIC_URL: http://localhost:45176
      # continuum-brain's brain-api (the Agents screen); its token is in continuum-api/.env.local
      BRAIN_URL: http://continuum-brain-api:45179
      # Continuum Data (datasets): off unless DATA_ENABLED=true in docker/.env.
      # Its code is mounted from ../continuum-data; files live in
      # ~/.continuum/data-store; steps run through continuum-data-runner-proxy.
      DATA_ENABLED: ${DATA_ENABLED:-false}
      DATA_MODULE: /continuum-data/src/index.js
      DATA_STORE_PATH: /store
      DATA_RUNNER_URL: http://continuum-data-runner-proxy:45191
      DATA_RUNNER_TOKEN: ${DATA_RUNNER_TOKEN:-dev-data-runner-token}
      # Seals the tokens people save for sources (Kaggle, Hugging Face). Development value only.
      DATA_SECRET_KEY: ${DATA_SECRET_KEY:-dev-data-secret-key}

    volumes:
      - ../continuum-data:/continuum-data:ro
      - ${HOME}/.continuum/data-store:/store

    depends_on:
      mongo:
        condition: service_healthy


  continuum-ui:
    build:
      context: ../continuum-bridge-spine
    container_name: continuum-ui
    restart: unless-stopped

    ports:
      - "45173:45173"

    environment:
      PORT: 45173
      VITE_PORT: 45173
      VITE_API_BASE_URL: http://localhost:45170
      VITE_DATA_ENABLED: ${DATA_ENABLED:-false}

    depends_on:
      - continuum-api

    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]


  # Development servers per project (OpenVSCode Server in a container each).
  # Local development only: it drives Docker through Docker's socket, which
  # gives it full control of Docker on this machine. The cloud uses Kubernetes.
  # Workspace images first (the sandboxes: every tool, then Node, Python, Java), from ../continuum-workspaces/image:
  #   docker build -t continuum-workspace:dev .
  #   docker build --target node -t continuum-workspace-node:dev .   (and python, java likewise)
  continuum-workspaces:
    build:
      context: ../continuum-workspaces
    container_name: continuum-workspaces
    restart: unless-stopped
    # Root only to use Docker's socket (local development)
    user: "0"
    ports:
      # The editors (/w/<id>/…); the internal API (45177) stays on the Docker network
      - "45176:45176"
    environment:
      PUBLIC_PORT: 45176
      INTERNAL_PORT: 45177
      DRIVER: docker
      WORKSPACE_IMAGE: continuum-workspace:dev
      WORKSPACE_IMAGE_NODE: continuum-workspace-node:dev
      WORKSPACE_IMAGE_PYTHON: continuum-workspace-python:dev
      WORKSPACE_IMAGE_JAVA: continuum-workspace-java:dev
      WORKSPACE_NETWORK: docker_default
      IDLE_MINUTES: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  # Continuum Data's runner proxy: the only part of it holding Docker's socket.
  # It starts continuum-data-runner containers (one per pipeline step) with the
  # user's folder of ~/.continuum/data-store as /store, and nothing else.
  # Runner image first: docker build -t continuum-data-runner:dev ../continuum-data/runner-image
  continuum-data-runner-proxy:
    build:
      context: ../continuum-data/runner-proxy
    container_name: continuum-data-runner-proxy
    restart: unless-stopped
    # Root only to use Docker's socket (local development)
    user: "0"
    ports:
      - "127.0.0.1:45191:45191"
    environment:
      PORT: 45191
      PROXY_TOKEN: ${DATA_RUNNER_TOKEN:-dev-data-runner-token}
      RUNNER_IMAGE: continuum-data-runner:dev
      STORE_HOST_PATH: ${HOME}/.continuum/data-store
      EGRESS_NETWORK: continuum_data_egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


volumes:
  mongo_data:

secrets:
  mongo_keyfile:
    file: ./mongo/mongo-keyfile
