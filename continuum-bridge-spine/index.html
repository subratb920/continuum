<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-compact.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>continuum-bridge-spine</title>
  <!-- The colour theme before anything draws (no flash): the theme id and its page colour,
       remembered by src/utils/preferences.js (Settings → Appearance); works for any theme -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("continuum_prefs") || "{}").theme || "dark";
      if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      var bg = localStorage.getItem("continuum_theme_page");
      if (bg) document.documentElement.style.backgroundColor = bg;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
