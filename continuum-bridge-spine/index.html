<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-compact.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Continuum: AI Agent Orchestration Platform &amp; AI IDE</title>
  <meta name="description" content="AI-driven platform: orchestrate AI agents and AI workflows, build enterprise systems and products, modernize mainframes, automate ML pipelines and deploy." />
  <meta property="og:title" content="Continuum: AI Agent Orchestration Platform &amp; AI IDE" />
  <meta property="og:description" content="Orchestrate AI agents and AI workflows, build products and enterprise systems, automate ML pipelines and deploy to your cloud." />
  <meta property="og:image" content="https://continuum-console.one/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- The browser's bars (address bar, tab bar, installed app's title bar): the header's colour.
       Dark by default; src/utils/preferences.js keeps them in step with the chosen theme -->
  <meta name="theme-color" content="#171717" />
  <meta name="color-scheme" content="dark" />
  <!-- The colour theme before anything draws (no flash): the theme id and its page colour,
       remembered by src/utils/preferences.js (Settings → Appearance); works for any theme -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("continuum_prefs") || "{}").theme || "dark";
      if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      var bg = localStorage.getItem("continuum_theme_page");
      if (bg) document.documentElement.style.backgroundColor = bg;
      // The browser's bars and menus in the theme's colours from the first paint
      var header = localStorage.getItem("continuum_theme_header");
      var scheme = localStorage.getItem("continuum_theme_scheme");
      if (header) document.querySelector('meta[name="theme-color"]').content = header;
      if (scheme) document.querySelector('meta[name="color-scheme"]').content = scheme;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
