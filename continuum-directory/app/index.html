<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-compact.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Continuum Directory</title>
  <meta name="theme-color" content="#171717" />
  <meta name="color-scheme" content="dark light" />
  <!-- The colour theme before anything draws: the one chosen here, else the system's -->
  <script>
    try {
      var t = localStorage.getItem("continuum_directory_theme") || "system";
      if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
